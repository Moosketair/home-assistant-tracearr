<!doctype html>
<html lang="fr"><meta charset="utf-8"><title>Recette locale des cartes Tracearr</title>
<style>
  body {font: 15px system-ui; --primary-text-color: #16232b; --accent-color: #008899}
  @media (prefers-color-scheme: dark) {
    body {background:#16232b; --primary-text-color:#f0f4f8; --accent-color:#53ced5}
  }
  ha-card {display:block} pre {white-space:pre-wrap} #host {max-width:none}
</style>
<h1>Carte de recette</h1>
<label>Largeur <select id="width"><option>250</option><option selected>320</option><option>768</option><option>1200</option></select> px</label>
<button id="type">Groupée / individuelle</button> <button id="layout">Liste / carrousel</button> <button id="pause">Pause / reprise</button>
<button id="label">Badge court / long</button> <button id="mount">Démonter / remonter</button>
<div id="host"></div><pre id="result"></pre>
<script src="../custom_components/tracearr_ha/frontend/tracearr-card.js"></script>
<script>
  const el = id => document.getElementById(id);
  const host = el("host"), sizes = [250, 320, 768, 1200], reports = [];
  const params = new URLSearchParams(location.search);
  // Let native layout, ResizeObserver and any deferred reflow settle.
  const frame = () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(() => requestAnimationFrame(resolve))));
  if (params.has("visual")) {
    for (const node of document.querySelectorAll("h1, label, body > button, #result")) node.hidden = true;
  }
  const longText = "Consommation distante des utilisateurs sur le serveur du séjour";
  let card, mode = "carousel", individual = false, longLabel = false, connection, listener, paused = false;
  const entry = {id:"fixture", connected:true, servers:[], streams:[1,2,3].map(i => ({
    id:String(i), server_id:"fixture", server_name:"Test", server_type:"plex", username:"Fixture",
    state:"playing", media_title:`Film ${i}`, duration_ms:120000, progress_ms:10000, bitrate:1000
  }))};
  function configure() {
    card?.setConfig({mode:individual ? "list" : mode, carousel_visible:2, carousel_transition:"none", show_title:false,
      header_show_video:true, header_show_bandwidth:true, header_metric_settings:{
         streams:{align:"left"}, bandwidth:{align:"center", label:longLabel ? longText : "Débit"}, video:{align:"right"}
      }});
  }
  function attach() {
    card = host.appendChild(document.createElement(individual ? "tracearr-stream-card" : "tracearr-streams-card"));
    configure();
    connection = {subscribeMessage:async fn => {
      listener = fn; fn({entries:[entry]}); return () => {if (listener === fn) listener = null;};
    }};
    card.hass = {connection, states:{}};
  }
  function measure(width) {
    host.style.width = `${width}px`;
    const rect = q => card.shadowRoot.querySelector(q).getBoundingClientRect();
    const root = rect(".root"), metrics = rect(".head-metrics"), center = rect(".align-center");
    const badges = [...card.shadowRoot.querySelectorAll(".metric")].map(b => b.getBoundingClientRect());
    return {width, mode:individual ? "individual" : mode, longLabel,
      visible:!individual && mode === "carousel" ? Math.round(rect(".streams").width / rect(".stream").width) : 1,
      centerOffsetPx:+(center.x+center.width/2-metrics.x-metrics.width/2).toFixed(2),
      overflowRightPx:Math.max(0, ...badges.map(b => Math.round(b.right-root.right))),
      overflowLeftPx:Math.max(0, ...badges.map(b => Math.round(root.left-b.left)))};
  }
  function display() {
    el("result").textContent = JSON.stringify({matrix:reports, current:card ? measure(+el("width").value) : "démontée"}, null, 2);
  }
  // A6: deliver only an options snapshot, with identical sessions and stats.
  function probeLanWan() {
    return [["carousel",false],["list",false],["list",true]].map(([layout,single]) => {
      if (single) { card.remove(); individual = true; attach(); }
      host.style.width = "320px";
      const publish = location => listener({entries:[{...entry, network_locations:{"server:fixture":location}}]});
      publish("remote");
      card.setConfig({mode:layout, carousel_visible:1, carousel_transition:"none",
        header_show_bandwidth:true, show_bitrate:true, bitrate_scope:"remote",
        show_poster:false, show_avatar:false});
      const root = card.shadowRoot;
      const read = () => {
        const panels = [...root.querySelectorAll(".stream")];
        return {header:root.querySelector('.metric[title="Débit distant"]')?.textContent,
          badges:panels.map(panel => [...panel.querySelectorAll(".chip")]
            .find(chip => chip.textContent.endsWith(" Mb/s"))?.textContent ?? null),
          ids:panels.map(panel => panel.dataset.session)};
      };
      const track = root.querySelector(".carousel");
      if (track) root.querySelector('button[data-step="1"]').click();
      const scroll = track?.scrollLeft, index = card._carouselIndex, before = read();
      publish("local");
      const after = read();
      publish("remote");
      const restored = read();
      const anchorPreserved = !track || (track === root.querySelector(".carousel") &&
        scroll > 0 && track.scrollLeft === scroll && card._carouselIndex === index);
      const ok = after.header?.endsWith("0.0 Mb/s") && after.badges.every(badge => badge === null) &&
        before.header?.endsWith(single ? "1.0 Mb/s" : "3.0 Mb/s") &&
        before.badges.every(badge => badge === "1.0 Mb/s") &&
        after.ids.join() === before.ids.join() && JSON.stringify(before) === JSON.stringify(restored) &&
        anchorPreserved;
      return {layout:single ? "individual" : layout, before, after, restored, anchorPreserved, ok};
    });
  }
  async function probeResponsive() {
    const root = () => card.shadowRoot;
    const find = q => root().querySelector(q);
    const all = q => [...root().querySelectorAll(q)];
    const rect = node => node.getBoundingClientRect();

        const min = l && overlaps(l,c) ? l.right + gap : box.left;
        const max = (r && overlaps(c,r) ? r.left - gap : box.right) - c.width;

      const overflowPx = overflow(box);
      return {cardPx:rect(card).width, availablePx:round(box.width), naturalPx, widths,
        overflowPx, outsideCardPx:overflow(outer), centerOffset, centerError, lines, oneLine, fits, collision, clipped, edgeAligned, intrinsic,
        ok:overflowPx <= 0.25 && !collision && !clipped && (centerError ?? 0) <= 0.25 &&

    }
    const rows = [];
    async function layout(name, groups, extra, titles) {
      host.style.width = "1200px";
      config(groups, extra);
      await frame();
      const natural = all(".head-group").map(g => [...g.children].reduce((sum,b) => sum + rect(b).width,0) +
        (g.childElementCount - 1) * parseFloat(getComputedStyle(g).columnGap));
      for (const width of [...sizes, 250, 1200]) {
        host.style.width = `${width}px`;
        await frame();
        const row = geometry(natural);
        const order = all(".metric").map(b => b.title).join("|") === titles.join("|");
        const title = extra?.show_title ? find("h3")?.textContent === extra.title : !find("h3");
        const shortCentered = name !== "court" || (row.oneLine && Math.abs(row.centerOffset) <= 0.25);
        const compact = name !== "long" || (width <= 320 ? row.lines === 2 : row.oneLine);
        const shifted = width !== 320 ||

          (name !== "droite large" || (row.oneLine && row.centerOffset < -1));
        rows.push({name,width,...row,order,title,compact,shifted,
          ok:row.ok && order && title && shortCentered && compact && shifted && row.cardPx === width});
      }
    }
    setState("7");
    const short = {left:"Flux", center:"D", right:"V"};
    await layout("court", short, {}, ["Flux","D","V"]);
    await layout("long", {...short,center:longText}, {}, ["Flux",longText,"V"]);
    await layout("centres multiples", short, {header_entity_badges:[sensor],
      header_badge_order:"entity:requests,streams,bandwidth,video"}, ["Flux","Demandes","D","V"]);
    const wideSide = "Flux distants HD";
    await layout("gauche large", {...short,left:wideSide}, {}, [wideSide,"D","V"]);
    await layout("droite large", {...short,right:wideSide}, {}, ["Flux","D",wideSide]);
    await layout("sans gauche", {center:"D",right:wideSide}, {}, ["D",wideSide]);
    await layout("sans droite", {left:"Flux",center:"D"}, {}, ["Flux","D"]);
    await layout("sans centre", {left:"Flux",right:"V"}, {show_title:true,title:"Mon serveur"}, ["Flux","V"]);
    await layout("centre seul", {center:longText}, {}, [longText]);
    await layout("centré sans espaces", {}, {header_entity_badges:[{...sensor,label:"M".repeat(75)}]}, ["M".repeat(75)]);
    await layout("texte agrandi", short, {font_size:28, header_entity_badges:[sensor]}, ["Flux","D","Demandes","V"]);
    mode = "list";
    await layout("liste titrée", short, {show_title:true,title:"Mon serveur"}, ["Flux","D","V"]);
    card.remove(); individual = true; attach();
    await layout("individuelle", {...short,center:longText}, {}, ["Flux",longText,"V"]);
    card.remove(); individual = false; mode = "carousel"; attach();

    host.style.width = "320px";
    config({left:"Flux",right:"Vidéo"}, {header_entity_badges:[sensor]});
    const carousel = find(".carousel");
    find('button[data-step="1"]').click();
    const index = card._carouselIndex, scroll = carousel.scrollLeft;
    const dynamic = [];
    for (const state of ["7","1234567890".repeat(8),"7"]) {
      setState(state);
      await frame();
      const badge = find(".align-center .metric"), center = rect(badge);
      dynamic.push({state,...geometry(), height:round(center.height), value:badge.textContent.endsWith(`${state} Go`),
        icon:badge.querySelector('ha-icon[icon="mdi:gauge"]') !== null, blink:badge.classList.contains("blink-positive"),
        anchor:carousel === find(".carousel") && index === card._carouselIndex && scroll === carousel.scrollLeft && scroll > 0});
    }
    const dynamicOk = dynamic.every(b => b.ok && b.value && b.icon && b.blink && b.anchor) &&
      dynamic[1].height > dynamic[0].height && dynamic[0].height === dynamic[2].height;
    const keyboard = [];
    for (const width of sizes) {
      host.style.width = `${width}px`;
      config(short, {carousel_show_arrows:false, carousel_mouse_drag:false});
      const track = find(".carousel");
      track.focus({preventScroll:true});
      const focused = root().activeElement === track;
      const send = key => !track.dispatchEvent(new KeyboardEvent("keydown",{key,bubbles:true,cancelable:true}));
      const right = send("ArrowRight"), forward = card._carouselIndex === 1 && track.scrollLeft > 0;
      const left = send("ArrowLeft"), back = card._carouselIndex === 0 && track.scrollLeft === 0;
      const noButtons = !find(".carousel-nav");
      const other = !send("a");
      keyboard.push({width,focused,right,forward,left,back,noButtons,other,
        ok:focused && right && forward && left && back && noButtons && other});
    }
    const artwork = [];
    for (const width of sizes) {
      host.style.width = `${width}px`;
      config(short,{show_poster:true,poster_size:135,stream_surface:"blur"});
      const poster = rect(find(".poster-wrap"));
      const stream = find(".stream");
      const columns = Math.round(rect(find(".streams")).width / rect(stream).width);
      artwork.push({width,poster:[poster.width,poster.height],columns,
        ok:poster.width === 99 && poster.height === 147 && !!find(".stream-backdrop .backdrop-empty") &&
          getComputedStyle(stream).backgroundColor === "rgb(25, 26, 29)" && columns === (width <= 320 ? 1 : 2)});
    }
    const empty = [];
    listener({entries:[{...entry,streams:[]}]});
    for (const emptyMode of ["message","header_only","hide"]) {
      config(short, {empty_mode:emptyMode,header_positive_only:true,
        header_entity_badges:[{...sensor,only_positive:true}],show_title:true,title:"Mon serveur"});
      setState("0");
      const noBadges = !find(".head-metrics");
      const expected = emptyMode === "message" ? !!find(".empty-message") && !!find("h3") :
        emptyMode === "header_only" ? !find(".streams") && !!find("h3") : card.style.display === "none";
      empty.push({emptyMode,ok:noBadges && expected});
    }
    listener({entries:[entry]});
    config(short, {show_header:false});
    const hiddenHeader = !find(".head") && all(".stream").length === entry.streams.length;
    config(short, {header_entity_badges:[{...sensor,show_name:false,zero_color_mode:"custom",zero_custom_color:"#202020"}]});
    const iconOnly = find(".align-center .metric[title=Demandes]");
    const customization = !!iconOnly?.querySelector("ha-icon") && iconOnly.textContent === "0 Go" &&
      !iconOnly.classList.contains("blink-positive") && iconOnly.style.getPropertyValue("--pill-bg") === "#202020";
    window.removeEventListener("error", captureError);
    return {ok:rows.every(r => r.ok) && dynamicOk && keyboard.every(r => r.ok) && artwork.every(r => r.ok) &&
      empty.every(r => r.ok) && hiddenHeader && customization && !observerErrors.length,
      theme:matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light",
      rows,dynamic,dynamicOk,keyboard,artwork,empty,hiddenHeader,customization,observerErrors};
  }
  async function probeLifecycle() {
    const results = [];
    const box = host.appendChild(document.createElement("div"));
    box.style.width = "320px";
    const active = entry.streams.slice(0,2).map(s => ({...s}));
    const subscribers = new Set();
    const hass = {states:{},connection:{
      subscribeMessage:async fn => {subscribers.add(fn); return () => subscribers.delete(fn);},
      sendMessagePromise:async ({path}) => {
        if (path.includes("/broken/")) throw Error("fixture");
        return {path};
      }
    }};
    const main = document.createElement("tracearr-streams-card");
    const second = document.createElement("tracearr-stream-card");
    const config = {mode:"carousel",carousel_transition:"none",carousel_autoplay:true,carousel_interval:120,
      header_show_bandwidth:true,header_metric_settings:{streams:{align:"left"},bandwidth:{align:"center"}},
      show_avatar:false};
    const report = node => ({
      positions:node._positions.size, images:node._images.size, attempts:node._imageAttempts.size,
      retries:node._imageRetryTimers.size, intervals:Number(node._tick != null) + Number(node._carouselTimer != null),
      headerObserver:Number(node._headerResize != null), frames:Number(node._headerFrame != null) + Number(node._carouselFrame != null),
      listeners:subscribers.size
    });

      for (const fn of subscribers) fn({entries:[{...entry,streams}]});
    };
    main.setConfig(config);
    main.hass = second.hass = hass;
    const beforeMount = report(main);
    box.append(main,second);
    publish(active);
    const clock = main._positions.get("1");
    const track = main.shadowRoot.querySelector(".carousel");
    main.shadowRoot.querySelector('button[data-step="1"]').click();
    const index = main._carouselIndex, scroll = track.scrollLeft;
    publish([{...active[0],bitrate:2600}, active[1]]);
    const anchor = index > 0 && scroll > 0 && main.shadowRoot.querySelector(".carousel") === track &&
      main._carouselIndex === index && track.scrollLeft === scroll;
    for (let i=0; i<18; i++) {
      publish([...active,{...active[0],id:`short-${i}`,poster_url:"/api/v1/images/proxy?fixture=1"}]);
      await Promise.resolve();
      publish(active);
    }
    publish([...active,{...active[0],id:"broken",poster_url:"/api/v1/images/proxy?fixture=2"}]);
    await frame();
    const peak = report(main);
    publish(active);
    const churn = report(main);
    const activeKept = main._positions.get("1") === clock && clock !== second._positions.get("1");
    publish([{...active[0],state:"paused"},active[1]]);
    const pausedAt = clock.progress;
    await frame();
    const frozen = clock.state === "paused" && main._positionAt(clock) === pausedAt;
    publish(active);
    await frame();
    const resumed = clock.state === "playing" && main._positionAt(clock) > pausedAt;

    for (let i=0; i<3; i++) {
      main.remove();
      const detached = report(main);

      const configured = report(main);
      box.prepend(main);
      publish(active);
      main.setConfig(config);
      const mounted = report(main);
      const stableTick = main._tick;
      main.setConfig(config);
      const timerStable = main._tick === stableTick;
      await Promise.resolve();
      results.push({detached,configured,mounted,timerStable});

    main.remove();
    second.remove();
    const end = report(main);

      clear(idle) && idle.intervals === 0 && results.every(({detached,configured,mounted,timerStable}) =>

  }
  async function probeBlink() {
    const results = [];
    const rows = [
      {id:"a",entity:"sensor.a",label:"A",align:"center",blink_positive:true,blink_seconds:.5},
      {id:"b",entity:"sensor.b",label:"B",align:"right",blink_positive:true,blink_seconds:.9,only_positive:true}
    ];
    for (const [type,layout] of [["streams","list"],["streams","carousel"],["stream","list"]]) {
      const node = host.appendChild(document.createElement(`tracearr-${type}-card`));
      node.setConfig({mode:layout,show_poster:false,show_avatar:false,header_show_bandwidth:true,header_entity_badges:rows,
        header_metric_settings:{streams:{blink_positive:true,blink_seconds:1.4,align:"left"}}});

      state("7","5");
      const publish = streams => push({entries:[{...entry,streams}]});
      publish(entry.streams);
      await frame();
      const find = name => node.shadowRoot.querySelector(`.metric[title="${name}"]`);

      };
      const durations = badges().map(b => b.getAnimations()[0].effect.getTiming().duration);
      const updates = [
        check("sensor A positive change", () => state("70","5")),
        check("sensor B positive change", () => state("70","50")),
        check("session progress", () => publish(entry.streams.map(s => ({...s,progress_ms:14000})))),
        check("session bitrate", () => publish(entry.streams.map(s => ({...s,bitrate:2100})))),
        check("session removal", () => publish(entry.streams.slice(0,2)))

      state("1","2");

      const running = badges().every(b => b.getAnimations().length === 1) &&

      const natural = find("A").getAnimations()[0];

        function collect() {

        }
        requestAnimationFrame(collect);
      });

        const times = [...node.shadowRoot.querySelectorAll(".times")].every(row => {
          const left = row.querySelector(".time-left")?.getBoundingClientRect();
          const right = row.querySelector(".time-paused")?.getBoundingClientRect();
          const rect = row.getBoundingClientRect();
          return left && right && row.querySelector(".time-remaining") && !row.querySelector(".time-end") &&
            Math.abs(right.right - rect.right) <= 1 && inside(left, rect) && inside(right, rect) &&
            (left.bottom <= right.top + 1 || left.right <= right.left + 1);
        });
        const header = find(".head-metrics").getBoundingClientRect();
        const badges = [...node.shadowRoot.querySelectorAll(".metric")].every(b => inside(b.getBoundingClientRect(),header));
        rows.push({type,mode,width,ok:times && badges,times,badges});
      }
      now += 6000;
      node._updateProgress();
      const frozen = paused.every(([time,width]) => time === "-1:48" && parseFloat(width) === 10) &&
        JSON.stringify(paused) === JSON.stringify(readTimes());
      const continuity = pulse && pulse === badge.getAnimations()[0] && pulse.currentTime > phase &&
        badge === find('[data-badge="streams"]') && track === find(".carousel");
      setCount("0");
      const zero = color(request) === "#505b67";
      setCount("3");
      const positive = normal();
      publish(true);
      const stale = !!find(".time-paused") && find(".time-end")?.textContent === "Non actualisé" &&
        !find(".time-end[data-id]") && !!find(".availability-status")?.textContent;
      streams.forEach(s => {s.state = "playing";});
      publish();
      const resumed = !find(".time-paused") && find(".time-end[data-id]")?.textContent.startsWith("Fin à ");
      rows.push({type,mode,ok:!!(playing && frozen && continuity && zero && positive && stale && resumed),
        playing,frozen,continuity,zero,positive,stale,resumed});
      node.remove();
    }
    if (!preview) for (const [type] of [layouts[0],layouts[2]]) {
      const editor = host.appendChild(document.createElement("tracearr-card-editor"));
      const find = q => editor.shadowRoot.querySelector(q);
      let saved;
      editor.addEventListener("config-changed",event => {saved = JSON.parse(JSON.stringify(event.detail.config));});
      editor.setConfig({...config,type:`custom:tracearr-${type}-card`,grid_options:{columns:6}});
      const change = (q,value) => {
        const field = find(q);
        field.value = value;
        field.dispatchEvent(new Event("change",{bubbles:true}));
      };
      const metric = '[data-metric-setting="normal_custom_color"][data-metric-key="streams"]';
      const entity = '[data-badge-setting="normal_custom_color"][data-badge-index="0"]';
      if (!find(`input${metric}`) || !find(`input${entity}`)) {
        editors.push({type,ok:false,controlsMissing:true});
        editor.remove();
        continue;
      }
      change(`input${metric}`,"#123456");
      change(`input${entity}`,"#654321");
      editor.setConfig(saved);
      const reread = find(`input${metric}`).value === "#123456" && find(`input${entity}`).value === "#654321";
      change(`select${metric}`,"inherit");
      change(`select${entity}`,"inherit");
      const reset = !("normal_custom_color" in saved.header_metric_settings.streams) &&
        !("normal_custom_color" in saved.header_entity_badges[0]) &&
        saved.header_metric_settings.streams.zero_custom_color === "#333344" &&
        saved.header_entity_badges[0].zero_custom_color === "#505b67" && saved.grid_options.columns === 6;
      editor.setConfig(saved);
      const inherited = find(`input${metric}`).disabled && find(`input${entity}`).disabled;
      change(`select${entity}`,"custom");
      const enabled = !find(`input${entity}`).disabled &&
        saved.header_entity_badges[0].normal_custom_color === find(`input${entity}`).value;
      editors.push({type,ok:reread && reset && inherited && enabled,reread,reset,inherited,enabled});
      editor.remove();
    }
    return {ok:rows.every(row => row.ok) && editors.every(row => row.ok),theme,rows,editors};
  }
  async function measureMatrix() {
    for (const label of [false,true]) {
      longLabel = label; configure();
      for (const w of sizes) {
        host.style.width = `${w}px`;
        await frame();
        reports.push(measure(w));
      }
    }
    longLabel = false; configure(); display();
  }
  attach();
  longLabel = params.get("visual") === "long"; configure(); display();
  el("width").onchange = display;
  el("type").onclick = () => {card?.remove(); individual = !individual; attach(); display();};
  el("layout").onclick = () => {mode = mode === "list" ? "carousel" : "list"; configure(); display();};
  el("label").onclick = () => {longLabel = !longLabel; configure(); display();};
  el("pause").onclick = () => {
    paused = !paused; entry.streams[0].state = paused ? "paused" : "playing";
    listener?.({entries:[entry]}); display();
  };
  el("mount").onclick = () => {if (card) {card.remove(); card=null;} else attach(); display();};
  if (params.has("lan-wan")) {
    const cases = probeLanWan();
    el("result").textContent = JSON.stringify({ok:cases.every(row => row.ok),
      theme:matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light", cases}, null, 2);
  }
  if (["technical","technical-finish","technical-preview","pause-colors","pause-colors-preview","outage","outage-preview","responsive","lifecycle","blink"].some(param => params.has(param))) {
    const probe = params.has("technical-finish") ? probeTechnicalFinish :
      params.has("technical") || params.has("technical-preview") ? () => probeTechnical(params.get("technical-preview")) :
      params.has("pause-colors") || params.has("pause-colors-preview") ? () => probePauseColors(params.has("pause-colors-preview")) :
      params.has("outage") || params.has("outage-preview") ? () => probeOutage(params.has("outage-preview")) :
      params.has("responsive") ? probeResponsive : params.has("lifecycle") ? probeLifecycle : probeBlink;
    probe().then(report => { el("result").textContent = JSON.stringify(report, null, 2); })
      .catch(error => { el("result").textContent = JSON.stringify({ok:false,error:String(error),stack:error.stack}); });
  } else if (!params.has("lan-wan") && !params.has("visual")) {
    measureMatrix();
  }
</script></html>
